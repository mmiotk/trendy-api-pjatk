syntax = "proto3";

package shipments.v1;

// import działa jak dołączenie typów google.protobuf: rozmiar skrytki
// bez kopii, nowy rozmiar w lockers.proto trafi do obu usług.
import "lockers/v1/lockers.proto";

service ShipmentService {
  rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);
}

message CreateShipmentRequest {
  string locker_id = 1;
  // Typ z innego pliku zapisuje się z nazwą jego pakietu.
  lockers.v1.CompartmentSize size = 2;
  // Kod adresata; w kontrakcie skrytek to samo pole to postal_code.
  string recipient_postal_code = 3;
}

message CreateShipmentResponse {
  string shipment_id = 1; // nadaje usługa przesyłek
  string pickup_code = 2; // z odpowiedzi usługi skrytek
}
