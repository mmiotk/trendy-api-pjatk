# `type` definiuje typ obiektowy. `Query` to punkt wejścia: jego pola są pytaniami, które można zadać.
# `[Stage!]!`: lista scen.
"""
Entry point to the festival API: each field answers one question of a screen.
"""
type Query {
  "All stages of the festival."
  stages: [Stage!]!
  # Argument pola: `id` w nawiasach podaje klient.
  "One stage or `null` when `id` does not exist."
  stage("Stage id, e.g. `stage-main`." id: ID!): Stage
  "One concert or `null` when `id` does not exist."
  concert("Concert id, e.g. `c1`." id: ID!): Concert
  "All performers: bands and solo artists."
  performers: [Performer!]!
  "Bands, solo artists and stages whose name contains the text."
  search("A fragment of the name, case-insensitive." text: String!): [SearchResult!]!
  "Concerts matching the filter (no filter: all)."
  concerts(filter: ConcertFilter): [Concert!]!
  # Paginacja kursorowa: `first` to rozmiar strony (domyślnie 3), `after` to kursor poprzedniej strony.
  """
  Concerts page by page, sorted by start time.

  - `first`: page size, default 3, at most 20
  - `after`: `endCursor` of the previous page; without it the first page is returned
  """
  concertsPage(filter: ConcertFilter, first: Int = 3, after: String): ConcertConnection!
}

# Komentarz: tylko dla czytającego plik.
"A place with a stage and a program."
type Stage {
  # `ID` to identyfikator, `String` to tekst.
  id: ID!
  name: String!
  # Brak `!`: pole może zwrócić null.
  "Where on the festival grounds the stage stands; `null` when the location is not decided yet."
  location: String
  # Relacja: pole zwraca obiekty innego typu, więc ze sceny można przejść do jej koncertów.
  concerts: [Concert!]!
}

"One performance by one performer on one stage."
type Concert {
  id: ID!
  title: String!
  # Własny skalar jako typ pola: w odpowiedzi trafia do klienta jako tekst w formacie ISO 8601.
  startsAt: DateTime!
  # `Int!`: liczba całkowita.
  durationMinutes: Int!
  genre: Genre!
  # Relacja w drugą stronę: z koncertu do sceny.
  stage: Stage!
  performer: Performer!
}

# `interface` wymienia pola wspólne dla kilku typów; zapytanie o interfejs może pytać tylko o te pola.
"Someone who can play a concert."
interface Performer {
  id: ID!
  name: String!
  concerts: [Concert!]!
}

# `implements`: typ ma wszystkie pola interfejsu i może dodać własne (tu `hometown`, `members`).
"A group of musicians."
type Band implements Performer {
  id: ID!
  name: String!
  "`null` when the band gave no hometown."
  hometown: String
  members: [String!]!
  concerts: [Concert!]!
}

"One musician."
type SoloArtist implements Performer {
  id: ID!
  name: String!
  # Pole tylko tego typu: nie ma go w interfejsie, więc zapytać o nie można przez `... on SoloArtist`.
  instrument: String!
  concerts: [Concert!]!
}

# `union` wylicza typy, które może zwrócić pole; w odróżnieniu od interfejsu nie wymaga wspólnych pól.
"What the search can find."
union SearchResult = Band | SoloArtist | Stage

"Concert filter: all fields are optional, a concert must satisfy every given one."
input ConcertFilter {
  stageId: ID
  "A fragment of the title, case-insensitive."
  titleContains: String
  genre: Genre
  # Ten sam skalar na wejściu: klient wysyła datę jako tekst, a `coerceInputValue` zamienia go na `Date`.
  "Concerts that start at this time or later."
  from: DateTime
  performer: PerformerRef
}

"Exactly one field must be given: the performer is a band or a solo artist."
input PerformerRef @oneOf {
  bandId: ID
  soloArtistId: ID
}

enum Genre {
  "Guitars, drums, loudness."
  ROCK
  "Improvisation on a theme."
  JAZZ
  "Synthesizers and sequencers."
  ELECTRONIC
  "Acoustic songs from the village tradition."
  FOLK
}

"A moment in time written as ISO 8601 text, e.g. 2026-07-10T18:00:00Z."
scalar DateTime

"One page of concerts."
type ConcertConnection {
  edges: [ConcertEdge!]!
  pageInfo: PageInfo!
}

type ConcertEdge {
  node: Concert!
  "An opaque position of a concert; passed as `after` it gives the next page."
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  "Cursor of the last concert on the page, `null` for an empty page."
  endCursor: String
}
