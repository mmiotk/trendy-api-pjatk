openapi: 3.1.0
info:
  title: Weather Stations API
  version: 2.0.0
  description: Written before any server code exists; the mock and the types come from this file.
servers:
  - url: /v2
paths:
  /stations/{stationId}/readings/latest:
    get:
      operationId: getLatestReading
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
              example:
                id: rd-1001
                stationId: st-01
                observedAt: "2026-09-25T09:00:00Z"
                temperatureValue: 14.2
                unit: celsius
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              example:
                error: station not found
  /stations/{stationId}/readings:
    post:
      operationId: recordReading
      parameters:
        - $ref: "#/components/parameters/StationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temperatureValue, unit]
              properties:
                temperatureValue: { type: number }
                unit: { type: string, enum: [celsius] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
components:
  parameters:
    StationId:
      name: stationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Reading:
      type: object
      required: [id, stationId, observedAt, temperatureValue, unit]
      properties:
        id: { type: string }
        stationId: { type: string }
        observedAt: { type: string, format: date-time }
        temperatureValue: { type: number }
        unit: { type: string, enum: [celsius] }
        qualityFlag: { type: string, enum: [ok, suspect, missing] }
