syntax = "proto3";

package weather.v1;

message Reading {
  string id = 1;
  string station_id = 2;
  string observed_at = 3;
  double temperature_celsius = 4;
  string quality_flag = 5;
}

message GetLatestReadingRequest {
  string station_id = 1;
}

message GetLatestReadingResponse {
  Reading reading = 1;
}

service WeatherService {
  rpc GetLatestReading(GetLatestReadingRequest) returns (GetLatestReadingResponse);
}
