asyncapi: 3.1.0
info:
  title: Weather Station Events
  version: 1.0.0
channels:
  stationReadings:
    address: "station/{stationId}/readings"
    parameters:
      stationId:
        description: The same stationId as in the OpenAPI contract
    messages:
      readingRecorded:
        $ref: "#/components/messages/ReadingRecorded"
operations:
  publishReadingRecorded:
    action: send
    channel:
      $ref: "#/channels/stationReadings"
components:
  messages:
    ReadingRecorded:
      payload:
        type: object
        required: [id, stationId, observedAt, temperatureCelsius]
        properties:
          id: { type: string }
          stationId: { type: string }
          observedAt: { type: string, format: date-time }
          temperatureCelsius: { type: number }
      examples:
        - payload:
            id: rd-1003
            stationId: st-01
            observedAt: "2026-09-25T10:00:00Z"
            temperatureCelsius: 15.1
