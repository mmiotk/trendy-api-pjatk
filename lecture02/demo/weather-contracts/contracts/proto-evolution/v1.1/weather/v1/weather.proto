// The SAME operation as contracts/openapi/weather.v1.yaml
// (GET /stations/{stationId}/readings/latest) written as a Protocol
// Buffers service definition. Validated with `buf lint` and, across
// versions, `buf breaking` (segment 4 and segment 7) — no gRPC server here,
// that is lecture 06-07's topic.
syntax = "proto3";

package weather.v1;

message Reading {
  string id = 1;
  string station_id = 2;
  string observed_at = 3;
  double temperature_celsius = 4;
  string quality_flag = 5; // optional additive field — segment 5 "compatible change"
}

message GetLatestReadingRequest {
  string station_id = 1;
}

message GetLatestReadingResponse {
  Reading reading = 1;
}

service WeatherService {
  rpc GetLatestReading(GetLatestReadingRequest) returns (GetLatestReadingResponse);
}
